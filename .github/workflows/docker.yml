name: Build and publish Docker image

on:
  push:
    branches: ["main"]
    tags: ["v*"]

  pull_request:
    branches: ["main"]

env:
  IMAGE: ghcr.io/zinalog/zinalog

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Capture build metadata
        id: metadata
        run: |
          echo "app_version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "app_commit_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build app
        env:
          APP_VERSION: ${{ steps.metadata.outputs.app_version }}
          APP_COMMIT_SHA: ${{ steps.metadata.outputs.app_commit_sha }}
          NEXT_PUBLIC_APP_VERSION: ${{ steps.metadata.outputs.app_version }}
          NEXT_PUBLIC_APP_COMMIT_SHA: ${{ steps.metadata.outputs.app_commit_sha }}
        run: npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/build-push-action@v5
        with:
          build-args: |
            APP_VERSION=${{ steps.metadata.outputs.app_version }}
            APP_COMMIT_SHA=${{ steps.metadata.outputs.app_commit_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:ci-${{ github.sha }}

      - name: Build and push Docker image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v5
        with:
          build-args: |
            APP_VERSION=${{ steps.metadata.outputs.app_version }}
            APP_COMMIT_SHA=${{ steps.metadata.outputs.app_commit_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.metadata.outputs.image_tag }}
